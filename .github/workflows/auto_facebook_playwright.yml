name: Auto Facebook Playwright Post (No Graph API)

on:
  schedule:
    # 7:30 AM Sri Lanka time -> 02:00 UTC
    - cron: '00 02 * * *'
    # 6:30 PM Sri Lanka time -> 13:00 UTC
    - cron: '00 13 * * *'

  workflow_run:
    workflows: ["Auto Gossip Shorts (Publish Twice Daily)"]
    types:
      - completed

  workflow_dispatch:

jobs:
  publish-facebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Generate Video Content (if not present)
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NUM_IMAGES: '5'
        run: |
          python -c "
          import os, time, main2
          os.makedirs('work', exist_ok=True)
          if not os.path.exists('work/final.mp4'):
              print('Generating video content for Facebook...')
              last_error = None
              for attempt in range(3):
                  try:
                      title, desc, img_url, article_url, lead = main2.get_news_article()
                      lines = main2.generate_script(title, desc, lead)
                      bg = main2.fetch_and_prepare_bg(img_url)
                      tts_paths, durations = main2.create_tts_per_line(lines)
                      main2.build_final_video(bg, lines, tts_paths, durations, 'work/final.mp4')
                      with open('work/caption.txt', 'w', encoding='utf-8') as f:
                          f.write(title)
                      print(f'Video generated successfully on attempt {attempt+1}!')
                      last_error = None
                      break
                  except Exception as e:
                      last_error = e
                      print(f'Attempt {attempt+1}/3 failed: {e}')
                      if attempt < 2:
                          print('Retrying in 15 seconds...')
                          time.sleep(15)
              if last_error:
                  raise RuntimeError(f'Video generation failed after 3 attempts: {last_error}')
          else:
              print('Video already exists, skipping generation.')
          if not os.path.exists('work/final.mp4'):
              raise RuntimeError('work/final.mp4 still missing after generation step!')
          print(f'Video confirmed: {os.path.getsize(\"work/final.mp4\")} bytes')
          "

      - name: Run Facebook Playwright Publisher
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          FB_PAGE_ID: "61584777925866"
        run: |
          if [ -f "work/caption.txt" ]; then
            export CAPTION_TEXT="$(cat work/caption.txt)"
          fi
          python fb_playwright_poster.py

      - name: Upload Debug Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-playwright-screenshots
          path: "*.png"
