name: Publish Blogger Article

on:
  schedule:
    # 8:00 AM Sri Lanka time (UTC+5:30)
    - cron: "30 2 * * *"
    # 12:30 PM Sri Lanka time
    - cron: "0 7 * * *"
    # 6:00 PM Sri Lanka time
    - cron: "30 12 * * *"
    # 9:00 PM Sri Lanka time; use this as an initial evening audience test slot.
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-draft-publisher
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install publisher dependencies
        run: python -m pip install requests google-api-python-client google-auth

      - name: Publish Blogger article
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -u blogger_publisher.py
