name: Render and Publish Facebook Reel

on:
  schedule:
    # 10:00 AM and 7:00 PM Sri Lanka time (UTC+5:30), separate from test1.yml.
    - cron: '30 04 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: facebook-reel-publishing
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Verify Facebook login and Reel upload screen
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          FB_PAGE_ID: "100081981528810"
          HEADLESS: 'false'
        # GitHub's hosted runner has no visible desktop. Xvfb provides a small
        # headed display; Playwright records it so the run can be reviewed below.
        run: xvfb-run -a python fb_playwright_poster.py --preflight

      - name: Render a short and publish it to Facebook only
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          FB_PAGE_ID: "100081981528810"
          HEADLESS: 'false'
        run: xvfb-run -a python facebook_main.py

      - name: Upload browser debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-browser-debug
          path: |
            *.png
            video_recording/*.webm
          if-no-files-found: warn
