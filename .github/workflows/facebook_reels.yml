name: Render and Publish Facebook Reel

on:
  schedule:
    # 10:00 AM and 7:00 PM Sri Lanka time (UTC+5:30), separate from test1.yml.
    - cron: '30 04 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: facebook-reel-publishing
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render a short and publish it to Facebook only
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: v26.0
        run: python facebook_main.py
