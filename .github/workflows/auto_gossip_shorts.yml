name: Auto FB Reels (Publish Twice Daily)

on:
  schedule:
    # 7:00 AM Sri Lanka time -> 01:30 UTC
    #- cron: '30 01 * * *'

    # 6:00 PM Sri Lanka time -> 12:30 UTC
    #- cron: '30 12 * * *'

    # 10:00 AM U.S. Eastern Time -> 15:00 UTC
    #- cron: '00 15 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug FB credentials
        run: |
          echo "FB_PAGE_ID is set: ${FB_PAGE_ID:+YES}"
          echo "FB_PAGE_ACCESS_TOKEN is set: ${FB_PAGE_ACCESS_TOKEN:+YES}"
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Run automation
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          NUM_IMAGES: '5'
        run: |
          python main2.py
