name: test

on:
  schedule:
    # Run twice daily at different times
    - cron: '0 12 * * *'  # 12 PM UTC daily
    - cron: '0 20 * * *'  # 8 PM UTC daily
  workflow_dispatch:  # Manual trigger

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent long runs
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo apt-get install -y fonts-dejavu-core fonts-liberation
        # Create directory for uploaded titles
        mkdir -p /tmp/youtube_shorts
        
    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install -r requirements3.txt
        
    - name: Create and upload YouTube Short
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: |
        python main3.py
        
    - name: Upload generated video (for debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: youtube-shorts-video
        path: /tmp/youtube_shorts/*.mp4
        retention-days: 1
        
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: process-logs
        path: /tmp/youtube_shorts/*.log
        retention-days: 1
        
    - name: Clean workspace
      if: always()
      run: |
        rm -rf /tmp/youtube_shorts
