name: Test

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 12 PM UTC
  workflow_dispatch:

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo apt-get install -y fonts-dejavu-core
        
    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install gtts==2.3.2 Pillow==10.1.0 requests==2.31.0
        pip install moviepy==1.0.3
        pip install google-api-python-client==2.108.0 google-auth==2.23.4 google-auth-oauthlib==1.1.0
        
    - name: Create YouTube Short
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: |
        python main3.py
        
    - name: Upload video for debugging
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: youtube-shorts-video
        path: /tmp/youtube_shorts/*.mp4
        if-no-files-found: warn
        retention-days: 1
