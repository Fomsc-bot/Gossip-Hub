name: Auto Gossip Shorts (Publish Twice Daily)

on:
  schedule:
    # Monday (12–3 PM)
    - cron: '30 12 * * 1'
    - cron: '00 14 * * 1'

    # Tuesday (2–5 PM)
    - cron: '30 14 * * 2'
    - cron: '00 16 * * 2'

    # Wednesday (3–6 PM)
    - cron: '30 15 * * 3'
    - cron: '00 17 * * 3'

    # Thursday (12–3 PM)
    - cron: '30 12 * * 4'
    - cron: '00 14 * * 4'

    # Friday (3–6 PM)
    - cron: '30 15 * * 5'
    - cron: '00 17 * * 5'

    # Saturday (10 AM–1 PM)
    - cron: '30 10 * * 6'
    - cron: '00 12 * * 6'

    # Sunday (9–11 AM)
    - cron: '30 09 * * 0'
    - cron: '30 10 * * 0'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
          NUM_IMAGES: '5'
        run: |
          python main.py
